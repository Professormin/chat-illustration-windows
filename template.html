<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话示意图模板</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1efe9;color:#24302d;font:15px system-ui,sans-serif}main{margin:auto;max-width:1120px;padding:24px;display:grid;grid-template-columns:minmax(310px,1fr) minmax(300px,500px);gap:26px;align-items:start}section{background:white;padding:22px;border-radius:18px}h1{margin:0 0 16px;font-size:24px}label{display:grid;gap:4px;margin:8px 0}fieldset{margin:14px 0;border:1px solid #ced8d3;border-radius:10px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:8px;border:1px solid #b8c5bf;border-radius:6px}button{padding:9px 13px;border:0;border-radius:8px;background:#315c52;color:white;cursor:pointer;margin:4px}button.secondary{color:#315c52;background:#e3eee8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%;height:auto;display:block;border-radius:14px}output{display:block;margin:6px 0;color:#45635b}[hidden]{display:none!important}@media(max-width:720px){main{grid-template-columns:1fr}}</style>
<main><section><h1>对话示意图模板</h1><fieldset><legend>快速收集资料</legend>
<label>参考截图（可多选，仅本地预览）<input id="refs" type="file" accept="image/*" multiple></label><div id="refPreview" style="display:flex;flex-wrap:wrap;gap:8px"></div>
<div class="row"><label>对话类型<select id="intakeMode"><option value="group">微信群聊</option><option value="direct">一对一</option></select></label><label>消息怎么展示<select id="intakeType"><option value="text">文字气泡</option><option value="voice">语音气泡＋转写</option><option value="voiceOnly">仅显示语音时长</option></select></label></div>
<label>群名或联系人的称呼<input id="intakeTitle" placeholder="可用化名"></label>
<label id="intakeMembersLabel">群人数<input id="intakeMembers" type="number" min="1" max="99999" placeholder="可留空"></label>
<label>要展示的对话（一行一条，用「我：」或「昵称：」标记发送者）<textarea id="intakeText" rows="5" placeholder="同事甲：今天先看哪个版本？&#10;我：先看简版。"></textarea></label>
<div><button id="record" class="secondary">开始录音</button><button id="dictate" class="secondary">离线语音转文字</button></div>
<audio id="recording" controls hidden style="max-width:100%"></audio>
<label id="intakeSecondsLabel" hidden>语音时长（秒）<input id="intakeSeconds" type="number" min="1" max="600" value="8"></label>
<button id="applyIntake">用这些资料生成示意图</button><output id="intakeStatus" aria-live="polite"></output></fieldset>
<div class="row"><label>类型<select id="mode"><option value="group">群聊</option><option value="direct">一对一</option></select></label><label id="countLabel">群人数<input id="members" type="number" min="1" max="99999" value="6"></label></div>
<label>对话名称<input id="title" maxlength="50" value="视频制作小组"></label>
<label>整体时间（可留空）<input id="time" maxlength="32" value="周三 19:30"></label>
<fieldset><legend>角色与头像</legend><div id="people"></div><button class="secondary" id="addPerson">添加群成员</button></fieldset>
<fieldset><legend>消息</legend><output id="count"></output><div id="messages"></div><button class="secondary" id="add">添加消息</button></fieldset>
<button id="save">导出 PNG</button><output id="status" aria-live="polite"></output></section><canvas width="1080" height="1920" aria-label="对话示意图预览"></canvas></main>
<script>
const el=id=>document.getElementById(id);
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const people=[{name:'我'},{name:'同事甲'},{name:'同事乙'}];
const messages=[{sender:1,type:'text',text:'先看成片，还是先讲操作？',seconds:8,transcript:''},{sender:0,type:'voice',text:'',seconds:12,transcript:'先给大家看结果。接下来只演示两步，让观众看清楚效果是怎么出来的。'},{sender:2,type:'text',text:'好，我来准备前后对照画面。',seconds:8,transcript:''}];
const font=(size,weight=400)=>ctx.font=weight+' '+size+'px "Microsoft YaHei","PingFang SC",system-ui,sans-serif';
function box(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();}
function wrap(value,width){
 const rows=[];
 for(const part of value.split('\n')){
  let line='';
  for(const ch of part){
   if(line && ctx.measureText(line+ch).width>width){rows.push(line);line='';}
   line+=ch;
  }
  rows.push(line);
 }
 return rows;
}
function avatar(person,x,y,idx){
 const colors=['#3e7065','#996747','#646e9d','#8c6380'];
 box(x,y,76,76,18,colors[idx%colors.length]);
 if(person.image){
  const image=person.image, side=Math.min(image.width,image.height);
  ctx.save();ctx.beginPath();ctx.roundRect(x,y,76,76,18);ctx.clip();
  ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,x,y,76,76);ctx.restore();
 }else{
  font(36,650);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(Array.from(person.name.trim())[0]||'人',x+38,y+51);ctx.textAlign='left';
 }
}
function draw(){
 const group=el('mode').value==='group';
 const visible=messages.filter(m=>group||m.sender<2);
 el('count').textContent='当前展示 '+visible.length+' 条消息';
 el('countLabel').hidden=!group;
 el('addPerson').hidden=!group;
 const rows=visible.map(m=>{
  font(42,500);const lines=wrap(m.text,700);
  font(37);const transcript=m.transcript.trim()?wrap(m.transcript,680):[];
  const named=group&&m.sender!==0;
  const bubbleHeight=m.type==='voice'?70:lines.length*58+28;
  return {m,lines,transcript,named,bubbleHeight,height:(named?39:0)+Math.max(76,bubbleHeight)+(m.type==='voice'&&transcript.length?transcript.length*53+77:0)+32};
 });
 const total=rows.reduce((sum,r)=>sum+r.height,0);
 const height=Math.max(1920,total+400);
 const overflow=height>12000;
 el('status').textContent=overflow?'内容过长，请拆成多张。':height>1920?'内容较多，将导出 1080 × '+height+' 的长图。':'导出尺寸 1080 × 1920';
 el('save').disabled=overflow;
 if(overflow)return;
 canvas.height=height;
 ctx.fillStyle='#f1f2f1';ctx.fillRect(0,0,1080,height);
 box(32,32,1016,182,18,'#fff');
 font(54,750);ctx.fillStyle='#151915';ctx.fillText((el('title').value||'对话')+(group&&el('members').value?' ('+el('members').value+')':''),70,113,925);
 font(26,500);ctx.fillStyle='#426358';
 ctx.fillText([group?'群聊':'一对一',visible.length+' 条消息','微信对话示意'].join('   /   '),70,167);
 let y=266;
 if(el('time').value.trim()){font(27);ctx.textAlign='center';ctx.fillStyle='#586963';ctx.fillText(el('time').value,540,y);ctx.textAlign='left';y+=50;}
 for(const r of rows){
  const {m,lines,transcript,named,bubbleHeight}=r, right=m.sender===0, person=people[m.sender];
  const color=right?'#a4ec84':'#fff';
  avatar(person,right?953:51,y,m.sender);
  if(named){font(27,600);ctx.fillStyle='#52645c';ctx.fillText(person.name,150,y+26,780);}
  const yy=y+(named?39:0);
  font(42,500);
  const duration=Math.max(1,Math.min(600,Number(m.seconds)||1));
  const w=m.type==='voice'?Math.min(680,174+duration*7):Math.min(756,Math.max(86,...lines.map(line=>ctx.measureText(line).width+50)));
  const x=right?930-w:150;
  box(x,yy,w,bubbleHeight,12,color);
  const edge=right?x+w:x;
  ctx.beginPath();ctx.moveTo(edge,yy+23);ctx.lineTo(edge+(right?13:-13),yy+34);ctx.lineTo(edge,yy+45);ctx.closePath();ctx.fill();
  ctx.fillStyle='#202420';
  if(m.type==='voice'){
   font(31,650);ctx.fillText(duration+' 秒',x+w-87,yy+47,70);
   for(const [i,h] of [15,27,37,23,15].entries())box(x+25+i*13,yy+35-h/2,5,h,2,'#42786a');
   if(transcript.length){
    const tx=right?190:150, ty=yy+80;
    box(tx,ty,740,transcript.length*53+65,12,'#fff');
    font(24,650);ctx.fillStyle='#527368';ctx.fillText('语音转文字',tx+25,ty+31);
    font(37);ctx.fillStyle='#203932';transcript.forEach((line,i)=>ctx.fillText(line,tx+25,ty+76+i*53));
   }
  }else{lines.forEach((line,i)=>ctx.fillText(line,x+25,yy+54+i*58));}
  y+=r.height;
 }
 font(25,600);ctx.fillStyle='#52665b';ctx.fillText('微信对话示意',52,height-55);
}
function control(parent,label,node){
 const wrap=document.createElement('label');wrap.textContent=label;wrap.append(node);parent.append(wrap);return node;
}
function input(value,onInput,type='text'){
 const e=document.createElement('input');e.type=type;e.value=value;e.oninput=()=>{onInput(e.value);draw()};return e;
}
function area(value,onInput){
 const e=document.createElement('textarea');e.rows=2;e.value=value;e.oninput=()=>{onInput(e.value);draw()};return e;
}
function button(label,action){
 const e=document.createElement('button');e.className='secondary';e.textContent=label;e.onclick=action;return e;
}
function refresh(){
 const group=el('mode').value==='group';
 el('people').replaceChildren();el('messages').replaceChildren();
 people.forEach((p,i)=>{
  if(!group&&i>1)return;
  const block=document.createElement('div');block.className='row';el('people').append(block);
  control(block,i===0?'我的昵称':'角色 '+i,input(p.name,value=>{p.name=value;document.querySelectorAll('option[data-person="'+i+'"]').forEach(option=>option.textContent=value||'角色 '+i)}));
  const file=document.createElement('input');file.type='file';file.accept='image/*';
  file.onchange=()=>{
   const chosen=file.files[0];if(!chosen)return;
   const url=URL.createObjectURL(chosen), img=new Image();
   p.avatarToken=url;
   img.onload=()=>{URL.revokeObjectURL(url);if(p.avatarToken===url){p.image=img;draw()}};
   img.onerror=()=>{URL.revokeObjectURL(url);el('status').textContent='无法读取这张头像。'};
   file.value='';
  };
  control(block,'上传头像（可选）',file);
  block.append(button('清除头像',()=>{p.avatarToken=null;p.image=null;draw()}));
 });
 messages.forEach((m,i)=>{
  if(!group&&m.sender>1)return;
  const block=document.createElement('fieldset');
  const legend=document.createElement('legend');legend.textContent='消息 '+(i+1);block.append(legend);el('messages').append(block);
  const sender=document.createElement('select');
  people.forEach((p,j)=>{if(!group&&j>1)return;const option=new Option(p.name||'角色 '+j,j);option.dataset.person=j;sender.add(option)});
  sender.value=m.sender;sender.onchange=()=>{m.sender=Number(sender.value);draw()};
  control(block,'发送者',sender);
  const type=document.createElement('select');type.add(new Option('文字','text'));type.add(new Option('语音','voice'));type.value=m.type;
  control(block,'消息类型',type);
  const textGroup=document.createElement('div'),voiceGroup=document.createElement('div');
  block.append(textGroup,voiceGroup);
  control(textGroup,'文字',area(m.text,v=>m.text=v));
  const seconds=control(voiceGroup,'语音长度（秒）',input(m.seconds,v=>m.seconds=v,'number'));seconds.min=1;seconds.max=600;
  control(voiceGroup,'语音转文字（手动填写，可空）',area(m.transcript,v=>m.transcript=v));
  function toggle(){textGroup.hidden=m.type!=='text';voiceGroup.hidden=m.type!=='voice';draw()}
  type.onchange=()=>{m.type=type.value;toggle()};
  block.append(button('删除消息',()=>{messages.splice(i,1);refresh()}));toggle();
 });
 draw();
}
el('mode').onchange=()=>{el('title').value=el('mode').value==='group'?(el('title').dataset.groupTitle||'视频制作小组'):(el('title').dataset.directTitle||'同事甲');refresh()};
el('title').oninput=()=>{el('title').dataset[el('mode').value+'Title']=el('title').value;draw()};
el('members').oninput=el('time').oninput=draw;
el('addPerson').onclick=()=>{people.push({name:'群成员 '+people.length});refresh()};
el('add').onclick=()=>{messages.push({sender:0,type:'text',text:'',seconds:8,transcript:''});refresh()};
el('save').onclick=()=>{const a=document.createElement('a');a.download='对话示意.png';a.href=canvas.toDataURL('image/png');a.click()};
let refs=[];
el('refs').onchange=()=>{
 refs.forEach(url=>URL.revokeObjectURL(url));
 refs=Array.from(el('refs').files,file=>URL.createObjectURL(file));
 el('refPreview').replaceChildren(...refs.map((url,i)=>{
  const img=new Image();img.src=url;img.alt='参考截图 '+(i+1);
  img.style.cssText='max-width:120px;max-height:145px;object-fit:contain;border-radius:6px';
  return img;
 }));
};
el('intakeMode').onchange=()=>{el('intakeMembersLabel').hidden=el('intakeMode').value==='direct'};
el('intakeType').onchange=()=>{el('intakeSecondsLabel').hidden=el('intakeType').value==='text'};
const status=message=>el('intakeStatus').textContent=message;
let recorder, recordingUrl, starting=false;
el('record').onclick=async()=>{
 if(recorder?.state==='recording'){recorder.stop();return}
 if(starting)return;
 starting=true;
 let stream;
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const active=new MediaRecorder(stream), chunks=[];
  recorder=active;
  const start=performance.now();
  active.ondataavailable=event=>chunks.push(event.data);
  active.onstop=()=>{
   stream.getTracks().forEach(track=>track.stop());
   if(recordingUrl)URL.revokeObjectURL(recordingUrl);
   recordingUrl=URL.createObjectURL(new Blob(chunks,{type:active.mimeType}));
   el('recording').src=recordingUrl;el('recording').hidden=false;
   el('intakeSeconds').value=Math.max(1,Math.min(600,Math.round((performance.now()-start)/1000)));
   if(el('intakeType').value==='text')el('intakeType').value='voice';
   el('intakeType').onchange();
   el('record').textContent='重新录音';
   status('已记录时长。可回听，并在文字框填写要显示的转写。');
  };
  active.start();
  el('record').textContent='停止录音';
  status('正在录音');
 }catch{stream?.getTracks().forEach(track=>track.stop());status('麦克风不可用，请检查浏览器权限，或直接填写文字和时长。')}
 finally{starting=false}
};
el('dictate').onclick=async()=>{
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(typeof Speech?.available!=='function'){status('当前浏览器未提供离线识别，可回听录音并填写文字。');return}
 el('dictate').disabled=true;
 try{
  const lang='zh-CN';
  if(await Speech.available({langs:[lang],processLocally:true})!=='available'){
   status('中文离线识别包不可用，可回听录音并填写文字。');el('dictate').disabled=false;return;
  }
  const recognition=new Speech();
  if(!('processLocally' in recognition))throw new Error('offline unavailable');
  recognition.lang=lang;recognition.processLocally=true;
  recognition.onresult=event=>{
   const field=el('intakeText');
   field.value+=(field.value.trim()?'\n':'')+'我：'+event.results[0][0].transcript;
   status('识别结果已填入，可编辑。');
  };
  recognition.onerror=()=>status('离线识别未完成，可回听并填写文字。');
  recognition.onend=()=>{el('dictate').disabled=false};
  recognition.start();status('请说话，识别结果会填入文字框。');
 }catch{el('dictate').disabled=false;status('无法启动离线识别。')}
};
el('applyIntake').onclick=()=>{
 const mode=el('intakeMode').value, kind=el('intakeType').value;
 const lines=el('intakeText').value.split(/\r?\n/u).map(line=>line.trim()).filter(Boolean);
 if(!lines.length&&kind!=='voiceOnly'){status('请先填写至少一条对话。');return}
 if(messages.length&&!confirm('用收集的内容替换当前消息？'))return;
 const nextPeople=[{name:'我'},{name:'对方'}];
 const next=(lines.length?lines:['我：']).map(line=>{
  const explicit=line.match(/^([^：:]{1,20})[：:]\s*(.*)$/u);
  const name=explicit?.[1].trim()||'对方';
  const body=explicit?explicit[2]:line;
  let sender=0;
  if(name!=='我'){
   sender=nextPeople.findIndex(person=>person.name===name);
   if(mode==='direct'){
    if(nextPeople[1].name==='对方')nextPeople[1].name=name;
    sender=1;
   }else if(sender<0){
    if(nextPeople[1].name==='对方'&&!nextPeople[1].used){nextPeople[1].name=name;sender=1}
    else sender=nextPeople.push({name})-1;
   }
   nextPeople[sender].used=true;
  }
  return {sender,type:kind==='text'?'text':'voice',text:kind==='text'?body:'',seconds:el('intakeSeconds').value,transcript:kind==='voice'?body:''};
 });
 for(const person of nextPeople){
  const existing=people.find(p=>p.name===person.name);
  if(existing?.image)person.image=existing.image;
 }
 people.splice(0,people.length,...nextPeople);
 messages.splice(0,messages.length,...next);
 el('mode').value=mode;
 el('title').value=el('intakeTitle').value.trim()||(mode==='group'?'示意群聊':nextPeople[1].name);
 el('title').dataset[mode+'Title']=el('title').value;
 if(mode==='group')el('members').value=el('intakeMembers').value;
 refresh();
 status('已生成 '+next.length+' 条消息，可继续逐条调整和导出。');
};
refresh();
</script></html>
